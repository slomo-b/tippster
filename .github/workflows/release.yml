name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    # Secrets cannot be referenced inside `if:` — mirror them into env and test that instead.
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # release notes need the history behind them
          fetch-tags: true        # and the tags: checkout omits them by default, so the
                                  # notes would fall back to the entire history
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - name: Import the Windows code-signing certificate
        if: ${{ env.WINDOWS_CERTIFICATE != '' }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $c = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          "TAURI_WINDOWS_CERT_THUMBPRINT=$($c.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Sign the installers if a certificate is present
        run: node scripts/set-thumbprint.mjs
      - name: Release notes from the commits since the last tag
        id: notes
        shell: bash
        run: |
          # strip CR so a Windows checkout cannot break the tag comparison
          prev=$(git tag --sort=-v:refname | tr -d '\r' | grep -vx "$GITHUB_REF_NAME" | head -n1 || true)
          if [ -n "$prev" ]; then range="$prev..HEAD"; else range="HEAD"; fi
          echo "notes range: $range (previous tag: ${prev:-none})"
          out="$RUNNER_TEMP/notes.md"
          {
            echo "## Tippster $GITHUB_REF_NAME"
            echo
            echo "Touch typing, but gamified. For lazy sloperators whose typing is the real"
            echo "development bottleneck."
            echo
            echo "### What changed"
            git log --no-merges --pretty=format:'- %s' -n 40 "$range"
            echo
            echo
            echo "### Download"
            echo "- **\`Tippster_..._x64-setup.exe\`** — Windows installer, no admin needed"
            echo "- **\`Tippster_..._x64_en-US.msi\`** — MSI for managed installs"
            echo
            echo "Updates install themselves at your next pause. Untick it in the Sources tab"
            echo "to be asked first. The first run may show a Windows SmartScreen prompt —"
            echo "see the README for why and how to get past it."
          } > "$out"
          {
            echo 'body<<__NOTES_END__'
            cat "$out"
            echo '__NOTES_END__'
          } >> "$GITHUB_OUTPUT"
      - name: Build Tippster and create the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Tippster ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
