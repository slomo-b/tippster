name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - name: Build Tippster and create the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Tippster ${{ github.ref_name }}'
          releaseBody: |
            ## Tippster ${{ github.ref_name }}

            Touch typing, but gamified. For lazy sloperators whose typing is the real
            development bottleneck.

            ### Download
            - **`Tippster_..._x64-setup.exe`** — Windows installer (recommended)
            - **`Tippster_..._x64_en-US.msi`** — Windows MSI for managed installs

            No admin rights needed for the NSIS installer. Runs fully offline —
            fonts and effects are bundled. Your progress stays on your machine.

            ### Auto-update
            Installs are signed, and updates install themselves at your next pause —
            they never interrupt a line. Untick **install updates automatically** in
            the Sources tab if you would rather be asked first.

            ### What is inside
            12 lessons that unlock as you go (F J → D K → S L → A Ö → G H → Ä →
            R U → E I → W O → Q P T Z Ü → bottom row → final boss), an adaptive
            engine that over-weights your weakest key, XP, streaks, combos,
            23 badges, boss fights, and a daily challenge with a ghost race
            against your own best run.

            5 minutes a day is enough. Built on lessons from Monkeytype, Keybr
            and Tipp10.
          releaseDraft: false
          prerelease: false
