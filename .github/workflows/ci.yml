name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Frontend-Build
        run: npm run build

  rust-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri-build prüft frontendDist ("../dist") schon beim Kompilieren -> muss existieren.
      - name: Frontend bauen
        run: |
          npm ci
          npm run build
      - name: Rust kompiliert (ohne Bundle)
        run: cargo build --manifest-path src-tauri/Cargo.toml
